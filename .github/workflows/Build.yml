name: Building
on: [push, pull_request]

jobs:
  build:
    name: Building SCLAlertView
    runs-on: macos-15
    strategy:
      matrix:
        scheme: [
          SCLAlertView
        ]
        destination: [
          'platform=iOS Simulator,name=iPhone 16,OS=26.1'
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: 26.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.2
          bundler-cache: true

      - name: Building and testing ${{ matrix.scheme }} on ${{ matrix.destination }}
        run: |
          set -o pipefail && xcodebuild -project SCLAlertView.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination }}' \
            clean build test CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Build framework
        run: |
          set -o pipefail && xcodebuild -project SCLAlertView.xcodeproj \
            -scheme SCLAlertViewFramework \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Validate CocoaPods integration
        run: bundle exec pod lib lint SCLAlertView-Objective-C.podspec --allow-warnings
