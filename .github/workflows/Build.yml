name: Building
on: [push, pull_request]

jobs:
  build:
    name: Building SCLAlertView
    runs-on: macos-15-intel
    strategy:
      matrix:
        scheme: [
          SCLAlertView
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.2
          bundler-cache: true

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -o pipefail
          xcrun simctl list devices available --json | ruby -rjson -e '
            device = JSON.parse(STDIN.read).fetch("devices")
              .select { |runtime, _| runtime.include?(".iOS-") }
              .values.flatten.find { |item| item.fetch("name").start_with?("iPhone") }
            abort "No available iPhone simulator is installed" unless device
            puts "udid=#{device.fetch("udid")}"
          ' >> "$GITHUB_OUTPUT"

      - name: Building and testing ${{ matrix.scheme }}
        run: |
          set -o pipefail && xcodebuild -project SCLAlertView.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            clean build test CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Build framework
        run: |
          set -o pipefail && xcodebuild -project SCLAlertView.xcodeproj \
            -scheme SCLAlertViewFramework \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Validate CocoaPods integration
        run: bundle exec pod lib lint SCLAlertView-Objective-C.podspec --allow-warnings
